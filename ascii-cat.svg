<defs>

<style>

.ascii-row {
    opacity: 0;
    animation: typeRow 0.42s ease-out forwards;
}

@keyframes typeRow {

    0% {
        opacity: 0;
        transform: translateX(-8px);
    }

    100% {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

